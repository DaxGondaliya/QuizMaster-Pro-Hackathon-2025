<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - QuizMaster Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-content {
            padding-top: 100px;
            padding-bottom: 50px;
        }
        
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .navbar-custom {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .leaderboard-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        
        .leaderboard-item:hover {
            transform: translateY(-3px);
        }
        
        .rank-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        .rank-1 { background: linear-gradient(45deg, #FFD700, #FFA500); color: white; }
        .rank-2 { background: linear-gradient(45deg, #C0C0C0, #808080); color: white; }
        .rank-3 { background: linear-gradient(45deg, #CD7F32, #8B4513); color: white; }
        .rank-other { background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
        
        .nav-tabs .nav-link {
            border-radius: 25px;
            margin-right: 10px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .nav-tabs .nav-link.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }
        
        .trophy-icon {
            font-size: 2rem;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>QuizMaster Pro
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/student">
                            <i class="fas fa-user-graduate me-1"></i>Student Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            <i class="fas fa-history me-1"></i>History
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="text-center text-white mb-5">
                <h1 class="display-4">
                    <i class="fas fa-trophy trophy-icon text-warning"></i>
                    Leaderboard
                </h1>
                <p class="lead">See how you rank among top performers!</p>
            </div>

            <!-- Navigation Tabs -->
            <div class="text-center mb-4">
                <ul class="nav nav-tabs justify-content-center" id="leaderboardTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="overall-tab" data-bs-toggle="tab" data-bs-target="#overall" type="button" role="tab">
                            <i class="fas fa-globe me-2"></i>Overall Rankings
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="recent-tab" data-bs-toggle="tab" data-bs-target="#recent" type="button" role="tab">
                            <i class="fas fa-clock me-2"></i>Recent Scores
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="top-performers-tab" data-bs-toggle="tab" data-bs-target="#top-performers" type="button" role="tab">
                            <i class="fas fa-star me-2"></i>Top Performers
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Tab Content -->
            <div class="tab-content" id="leaderboardTabContent">
                <!-- Overall Rankings -->
                <div class="tab-pane fade show active" id="overall" role="tabpanel">
                    <div class="card card-custom">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-ranking-star me-2"></i>Overall Student Rankings
                            </h4>
                        </div>
                        <div class="card-body">
                            <div id="overallLeaderboard">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading leaderboard...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Scores -->
                <div class="tab-pane fade" id="recent" role="tabpanel">
                    <div class="card card-custom">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-clock me-2"></i>Recent High Scores
                            </h4>
                        </div>
                        <div class="card-body">
                            <div id="recentScores">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading recent scores...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Top Performers -->
                <div class="tab-pane fade" id="top-performers" role="tabpanel">
                    <div class="card card-custom">
                        <div class="card-header bg-warning text-dark">
                            <h4 class="mb-0">
                                <i class="fas fa-star me-2"></i>Top Performers (80%+ Scores)
                            </h4>
                        </div>
                        <div class="card-body">
                            <div id="topPerformers">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-warning" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading top performers...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await loadOverallLeaderboard();
        });
        
        // Tab change event listeners
        document.getElementById('recent-tab').addEventListener('shown.bs.tab', loadRecentScores);
        document.getElementById('top-performers-tab').addEventListener('shown.bs.tab', loadTopPerformers);
        
        async function loadOverallLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard/overall');
                const data = await response.json();
                
                const container = document.getElementById('overallLeaderboard');
                
                if (data.leaderboard && data.leaderboard.length > 0) {
                    container.innerHTML = data.leaderboard.map(user => `
                        <div class="leaderboard-item">
                            <div class="row align-items-center">
                                <div class="col-auto">
                                    <div class="rank-badge ${getRankClass(user.rank)}">
                                        ${user.rank <= 3 ? getTrophyIcon(user.rank) : user.rank}
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="row">
                                        <div class="col-md-4">
                                            <h6 class="mb-1">${user.name}</h6>
                                            <small class="text-muted">${user.email}</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-primary">${user.totalScore}</strong>
                                            <br><small class="text-muted">Total Score</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-success">${user.quizzesAttempted}</strong>
                                            <br><small class="text-muted">Quizzes</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-warning">${user.averageScore.toFixed(1)}</strong>
                                            <br><small class="text-muted">Avg Score</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            ${getPerformanceBadge(user.averageScore)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-users fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No rankings yet</h4>
                            <p class="text-muted">Be the first to take a quiz and appear on the leaderboard!</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('overallLeaderboard').innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <h4 class="text-warning">Error loading leaderboard</h4>
                        <p class="text-muted">Please refresh the page to try again.</p>
                    </div>
                `;
            }
        }
        
        async function loadRecentScores() {
            try {
                const response = await fetch('/api/leaderboard/recent?limit=20');
                const data = await response.json();
                
                const container = document.getElementById('recentScores');
                
                if (data.recentScores && data.recentScores.length > 0) {
                    container.innerHTML = data.recentScores.map((score, index) => `
                        <div class="leaderboard-item">
                            <div class="row align-items-center">
                                <div class="col-auto">
                                    <div class="rank-badge rank-other">
                                        ${index + 1}
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="row">
                                        <div class="col-md-3">
                                            <h6 class="mb-1">${score.studentName}</h6>
                                            <small class="text-muted">${score.studentEmail}</small>
                                        </div>
                                        <div class="col-md-3">
                                            <strong>${score.quizTitle}</strong>
                                            <br><small class="text-muted">Quiz</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-primary">${score.score}/${score.totalPoints}</strong>
                                            <br><small class="text-muted">Score</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-success">${score.percentage}%</strong>
                                            <br><small class="text-muted">Percentage</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <small class="text-muted">${formatTimeSpent(score.timeSpent)}</small>
                                            <br><small class="text-muted">${new Date(score.completedAt).toLocaleDateString()}</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-clock fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No recent scores</h4>
                            <p class="text-muted">Recent quiz attempts will appear here.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading recent scores:', error);
                document.getElementById('recentScores').innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <h4 class="text-warning">Error loading recent scores</h4>
                    </div>
                `;
            }
        }
        
        async function loadTopPerformers() {
            try {
                const response = await fetch('/api/leaderboard/top-performers');
                const data = await response.json();
                
                const container = document.getElementById('topPerformers');
                
                if (data.topPerformers && data.topPerformers.length > 0) {
                    container.innerHTML = data.topPerformers.map((performer, index) => `
                        <div class="leaderboard-item">
                            <div class="row align-items-center">
                                <div class="col-auto">
                                    <div class="rank-badge ${getRankClass(index + 1)}">
                                        ${index < 3 ? getTrophyIcon(index + 1) : index + 1}
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="row">
                                        <div class="col-md-3">
                                            <h6 class="mb-1">${performer.studentName}</h6>
                                            <small class="text-muted">Top Performer</small>
                                        </div>
                                        <div class="col-md-3">
                                            <strong>${performer.quizTitle}</strong>
                                            <br><small class="text-muted">Quiz</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-success">${performer.percentage}%</strong>
                                            <br><small class="text-muted">Score</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <strong class="text-primary">${performer.score}/${performer.totalPoints}</strong>
                                            <br><small class="text-muted">Points</small>
                                        </div>
                                        <div class="col-md-2 text-center">
                                            <small class="text-muted">${formatTimeSpent(performer.timeSpent)}</small>
                                            <br><small class="text-muted">${new Date(performer.completedAt).toLocaleDateString()}</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="text-center py-5">
                            <i class="fas fa-star fa-3x text-muted mb-3"></i>
                            <h4 class="text-muted">No top performers yet</h4>
                            <p class="text-muted">Students with 80% or higher scores will appear here.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading top performers:', error);
                document.getElementById('topPerformers').innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <h4 class="text-warning">Error loading top performers</h4>
                    </div>
                `;
            }
        }
        
        function getRankClass(rank) {
            if (rank === 1) return 'rank-1';
            if (rank === 2) return 'rank-2';
            if (rank === 3) return 'rank-3';
            return 'rank-other';
        }
        
        function getTrophyIcon(rank) {
            const icons = ['🥇', '🥈', '🥉'];
            return icons[rank - 1] || rank;
        }
        
        function getPerformanceBadge(average) {
            if (average >= 90) {
                return '<span class="badge bg-success">Excellent</span>';
            } else if (average >= 80) {
                return '<span class="badge bg-primary">Good</span>';
            } else if (average >= 70) {
                return '<span class="badge bg-warning">Average</span>';
            } else {
                return '<span class="badge bg-secondary">Needs Improvement</span>';
            }
        }
        
        function formatTimeSpent(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
