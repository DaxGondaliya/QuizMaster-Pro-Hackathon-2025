<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - QuizMaster Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-content {
            padding-top: 100px;
            padding-bottom: 50px;
        }
        
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .quiz-card {
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
        }
        
        .btn-custom {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
        }
        
        .btn-custom:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            color: white;
        }
        
        .navbar-custom {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>QuizMaster Pro
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/leaderboard">
                            <i class="fas fa-trophy me-1"></i>Leaderboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history">
                            <i class="fas fa-history me-1"></i>History
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-1"></i>Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <!-- User Welcome -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card card-custom">
                        <div class="card-body">
                            <h2 class="text-center mb-0">
                                <i class="fas fa-user-graduate text-primary me-2"></i>
                                Welcome, <span id="userName">Student</span>!
                            </h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Stats -->
            <div class="row mb-4" id="userStats" style="display: none;">
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-primary" id="totalScore">0</h3>
                        <p class="mb-0">Total Score</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-success" id="quizzesAttempted">0</h3>
                        <p class="mb-0">Quizzes Attempted</p>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stats-card">
                        <h3 class="text-warning" id="averageScore">0%</h3>
                        <p class="mb-0">Average Score</p>
                    </div>
                </div>
            </div>

            <!-- Available Quizzes -->
            <div class="row">
                <div class="col-12">
                    <div class="card card-custom">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-list-alt me-2"></i>Available Quizzes
                            </h4>
                        </div>
                        <div class="card-body">
                            <div class="row" id="quizzesList">
                                <div class="col-12 text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2">Loading quizzes...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check authentication
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || !user.id) {
            alert('Please login to access this page');
            window.location.href = '/';
        }
        
        // Display user name
        document.getElementById('userName').textContent = user.name || 'Student';
        
        // Load user data and quizzes
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserData();
            await loadQuizzes();
        });
        
        async function loadUserData() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    const userData = data.user;
                    
                    document.getElementById('totalScore').textContent = userData.totalScore || 0;
                    document.getElementById('quizzesAttempted').textContent = userData.quizzesAttempted || 0;
                    
                    const avgScore = userData.quizzesAttempted > 0 
                        ? Math.round((userData.totalScore / userData.quizzesAttempted) * 100) / 100
                        : 0;
                    document.getElementById('averageScore').textContent = avgScore + '%';
                    
                    document.getElementById('userStats').style.display = 'flex';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }
        
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quiz/available');
                const data = await response.json();
                
                const quizzesList = document.getElementById('quizzesList');
                
                if (data.quizzes && data.quizzes.length > 0) {
                    quizzesList.innerHTML = data.quizzes.map(quiz => `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card quiz-card h-100" onclick="startQuiz('${quiz._id}')">
                                <div class="card-header bg-light">
                                    <h5 class="card-title mb-0">
                                        <i class="fas fa-brain me-2 text-primary"></i>
                                        ${quiz.title}
                                    </h5>
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <p class="card-text flex-grow-1">
                                        ${quiz.description || 'Test your knowledge with this quiz!'}
                                    </p>
                                    <div class="quiz-info">
                                        <small class="text-muted d-block">
                                            <i class="fas fa-clock me-1"></i>
                                            Duration: ${quiz.duration} minutes
                                        </small>
                                        <small class="text-muted d-block">
                                            <i class="fas fa-star me-1"></i>
                                            Total Points: ${quiz.totalPoints}
                                        </small>
                                        <small class="text-muted d-block">
                                            <i class="fas fa-users me-1"></i>
                                            Attempts: ${quiz.attempts || 0}
                                        </small>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <button class="btn btn-custom w-100">
                                        <i class="fas fa-play me-2"></i>Start Quiz
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    quizzesList.innerHTML = `
                        <div class="col-12 text-center">
                            <div class="py-5">
                                <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                                <h4 class="text-muted">No quizzes available</h4>
                                <p class="text-muted">Check back later for new quizzes!</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading quizzes:', error);
                document.getElementById('quizzesList').innerHTML = `
                    <div class="col-12 text-center">
                        <div class="py-5">
                            <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                            <h4 class="text-warning">Error loading quizzes</h4>
                            <p class="text-muted">Please refresh the page to try again.</p>
                        </div>
                    </div>
                `;
            }
        }
        
        function startQuiz(quizId) {
            if (confirm('Are you ready to start this quiz? Make sure you have a stable internet connection.')) {
                window.location.href = `/quiz/${quizId}`;
            }
        }
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (error) {
                console.error('Logout error:', error);
            }
            
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/';
        });
    </script>
</body>
</html>
