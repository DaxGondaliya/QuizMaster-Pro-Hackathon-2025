<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz History - QuizMaster Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-content {
            padding-top: 100px;
            padding-bottom: 50px;
        }
        
        .card-custom {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .navbar-custom {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        
        .history-item {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        
        .history-item:hover {
            transform: translateY(-3px);
        }
        
        .score-badge {
            font-size: 1.1rem;
            padding: 8px 15px;
            border-radius: 20px;
        }
        
        .btn-custom {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
        }
        
        .btn-custom:hover {
            background: linear-gradient(45deg, #764ba2, #667eea);
            color: white;
        }
        
        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap me-2"></i>QuizMaster Pro
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/student">
                            <i class="fas fa-user-graduate me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/leaderboard">
                            <i class="fas fa-trophy me-1"></i>Leaderboard
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="container">
            <!-- Page Header -->
            <div class="text-center text-white mb-5">
                <h1 class="display-4">
                    <i class="fas fa-history me-3 text-info"></i>
                    Quiz History
                </h1>
                <p class="lead">Review your past quiz performances and track your progress</p>
            </div>

            <!-- User Stats Summary -->
            <div class="row mb-4" id="statsSection">
                <!-- Stats will be loaded here -->
            </div>

            <!-- History Content -->
            <div class="card card-custom">
                <div class="card-header bg-info text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-list me-2"></i>Your Quiz Attempts
                        </h4>
                        <div class="d-flex gap-2">
                            <select class="form-select form-select-sm" id="sortBy" style="width: auto;">
                                <option value="date-desc">Latest First</option>
                                <option value="date-asc">Oldest First</option>
                                <option value="score-desc">Highest Score</option>
                                <option value="score-asc">Lowest Score</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div id="historyContainer">
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Loading your quiz history...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-poll me-2"></i>Quiz Results Details
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <a href="/leaderboard" class="btn btn-custom">View Leaderboard</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let historyData = [];
        
        // Check authentication
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        if (!token || !user.id) {
            alert('Please login to view your quiz history');
            window.location.href = '/';
        }
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserStats();
            await loadQuizHistory();
        });
        
        document.getElementById('sortBy').addEventListener('change', () => {
            sortAndDisplayHistory();
        });
        
        async function loadUserStats() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    const userData = data.user;
                    
                    const avgScore = userData.quizzesAttempted > 0 
                        ? (userData.totalScore / userData.quizzesAttempted).toFixed(1)
                        : '0';
                    
                    document.getElementById('statsSection').innerHTML = `
                        <div class="col-md-3">
                            <div class="stats-card">
                                <h3 class="text-primary">${userData.quizzesAttempted || 0}</h3>
                                <p class="mb-0">Quizzes Taken</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <h3 class="text-success">${userData.totalScore || 0}</h3>
                                <p class="mb-0">Total Score</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <h3 class="text-warning">${avgScore}</h3>
                                <p class="mb-0">Average Score</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <h3 class="text-info">${getPerformanceLevel(parseFloat(avgScore))}</h3>
                                <p class="mb-0">Performance</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading user stats:', error);
            }
        }
        
        async function loadQuizHistory() {
            try {
                const response = await fetch('/api/quiz/history/user');
                const data = await response.json();
                
                if (response.ok && data.attempts) {
                    historyData = data.attempts;
                    sortAndDisplayHistory();
                } else {
                    showNoHistory();
                }
            } catch (error) {
                console.error('Error loading quiz history:', error);
                showError();
            }
        }
        
        function sortAndDisplayHistory() {
            const sortBy = document.getElementById('sortBy').value;
            let sortedData = [...historyData];
            
            switch(sortBy) {
                case 'date-desc':
                    sortedData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                case 'date-asc':
                    sortedData.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
                    break;
                case 'score-desc':
                    sortedData.sort((a, b) => b.percentage - a.percentage);
                    break;
                case 'score-asc':
                    sortedData.sort((a, b) => a.percentage - b.percentage);
                    break;
            }
            
            displayHistory(sortedData);
        }
        
        function displayHistory(attempts) {
            const container = document.getElementById('historyContainer');
            
            if (attempts && attempts.length > 0) {
                container.innerHTML = attempts.map(attempt => `
                    <div class="history-item" onclick="viewDetails('${attempt._id}')">
                        <div class="row align-items-center">
                            <div class="col-md-4">
                                <h5 class="mb-1">
                                    <i class="fas fa-brain text-primary me-2"></i>
                                    ${attempt.quizId.title}
                                </h5>
                                <p class="text-muted mb-0">${attempt.quizId.description || 'Quiz completed'}</p>
                            </div>
                            <div class="col-md-2 text-center">
                                <span class="score-badge ${getScoreBadgeClass(attempt.percentage)}">
                                    ${attempt.percentage}%
                                </span>
                            </div>
                            <div class="col-md-2 text-center">
                                <strong class="text-primary">${attempt.score}/${attempt.totalPoints}</strong>
                                <br><small class="text-muted">Score</small>
                            </div>
                            <div class="col-md-2 text-center">
                                <strong class="text-info">${formatTimeSpent(attempt.timeSpent)}</strong>
                                <br><small class="text-muted">Time Spent</small>
                            </div>
                            <div class="col-md-2 text-center">
                                <strong>${new Date(attempt.createdAt).toLocaleDateString()}</strong>
                                <br><small class="text-muted">${new Date(attempt.createdAt).toLocaleTimeString()}</small>
                            </div>
                        </div>
                        <div class="mt-2">
                            <span class="badge bg-${getStatusColor(attempt.status)} me-2">${getStatusText(attempt.status)}</span>
                            ${getPerformanceBadge(attempt.percentage)}
                            <span class="float-end text-muted">
                                <i class="fas fa-eye me-1"></i>Click to view details
                            </span>
                        </div>
                    </div>
                `).join('');
            } else {
                showNoHistory();
            }
        }
        
        function showNoHistory() {
            document.getElementById('historyContainer').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-history fa-3x text-muted mb-3"></i>
                    <h4 class="text-muted">No quiz history found</h4>
                    <p class="text-muted mb-4">You haven't taken any quizzes yet. Start taking quizzes to see your history here!</p>
                    <a href="/student" class="btn btn-custom">
                        <i class="fas fa-play me-2"></i>Take Your First Quiz
                    </a>
                </div>
            `;
        }
        
        function showError() {
            document.getElementById('historyContainer').innerHTML = `
                <div class="text-center py-5">
                    <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                    <h4 class="text-warning">Error loading history</h4>
                    <p class="text-muted mb-4">Please refresh the page to try again.</p>
                    <button class="btn btn-custom" onclick="location.reload()">
                        <i class="fas fa-refresh me-2"></i>Refresh Page
                    </button>
                </div>
            `;
        }
        
        async function viewDetails(attemptId) {
            try {
                const response = await fetch(`/api/quiz/attempt/${attemptId}`);
                const data = await response.json();
                
                if (response.ok && data.results) {
                    displayAttemptDetails(data.results);
                } else {
                    alert('Error loading quiz details');
                }
            } catch (error) {
                console.error('Error loading attempt details:', error);
                alert('Error loading quiz details');
            }
        }
        
        function displayAttemptDetails(results) {
            const modalBody = document.getElementById('modalBody');
            
            modalBody.innerHTML = `
                <div class="mb-4">
                    <div class="row text-center">
                        <div class="col-md-3">
                            <h4 class="text-primary">${results.attempt.score}/${results.attempt.totalPoints}</h4>
                            <small class="text-muted">Final Score</small>
                        </div>
                        <div class="col-md-3">
                            <h4 class="text-success">${results.attempt.percentage}%</h4>
                            <small class="text-muted">Percentage</small>
                        </div>
                        <div class="col-md-3">
                            <h4 class="text-info">${formatTimeSpent(results.attempt.timeSpent)}</h4>
                            <small class="text-muted">Time Spent</small>
                        </div>
                        <div class="col-md-3">
                            <h4 class="text-warning">${new Date(results.attempt.completedAt).toLocaleDateString()}</h4>
                            <small class="text-muted">Date Completed</small>
                        </div>
                    </div>
                </div>
                
                <h5 class="mb-3">
                    <i class="fas fa-brain me-2"></i>${results.quiz.title}
                </h5>
                <p class="text-muted mb-4">${results.quiz.description}</p>
                
                <h6 class="mb-3">Detailed Answer Review:</h6>
                <div class="accordion" id="answersAccordion">
                    ${results.answers.map((answer, index) => `
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading${index}">
                                <button class="accordion-button ${answer.isCorrect ? 'bg-light-success' : 'bg-light-danger'} collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                                    <div class="d-flex justify-content-between w-100 me-3">
                                        <span>Question ${index + 1}</span>
                                        <span class="badge ${answer.isCorrect ? 'bg-success' : 'bg-danger'}">
                                            ${answer.isCorrect ? 'Correct' : 'Incorrect'} (${answer.points} pts)
                                        </span>
                                    </div>
                                </button>
                            </h2>
                            <div id="collapse${index}" class="accordion-collapse collapse" data-bs-parent="#answersAccordion">
                                <div class="accordion-body">
                                    <p><strong>${answer.question}</strong></p>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <h6 class="text-muted">Your Answer:</h6>
                                            <p class="${answer.isCorrect ? 'text-success' : 'text-danger'}">
                                                <strong>${String.fromCharCode(65 + answer.selectedAnswer)}. ${answer.options[answer.selectedAnswer]}</strong>
                                            </p>
                                        </div>
                                        <div class="col-md-6">
                                            <h6 class="text-muted">Correct Answer:</h6>
                                            <p class="text-success">
                                                <strong>${String.fromCharCode(65 + answer.correctAnswer)}. ${answer.options[answer.correctAnswer]}</strong>
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
            modal.show();
        }
        
        function getScoreBadgeClass(percentage) {
            if (percentage >= 90) return 'badge bg-success';
            if (percentage >= 80) return 'badge bg-primary';
            if (percentage >= 70) return 'badge bg-warning';
            return 'badge bg-danger';
        }
        
        function getStatusColor(status) {
            switch(status) {
                case 'completed': return 'success';
                case 'timeout': return 'warning';
                case 'abandoned': return 'danger';
                default: return 'secondary';
            }
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'completed': return 'Completed';
                case 'timeout': return 'Time Out';
                case 'abandoned': return 'Abandoned';
                default: return 'Unknown';
            }
        }
        
        function getPerformanceBadge(percentage) {
            if (percentage >= 90) return '<span class="badge bg-success">Excellent</span>';
            if (percentage >= 80) return '<span class="badge bg-primary">Good</span>';
            if (percentage >= 70) return '<span class="badge bg-warning">Average</span>';
            return '<span class="badge bg-secondary">Needs Improvement</span>';
        }
        
        function getPerformanceLevel(avgScore) {
            if (avgScore >= 90) return 'Excellent';
            if (avgScore >= 80) return 'Good';
            if (avgScore >= 70) return 'Average';
            if (avgScore > 0) return 'Improving';
            return 'Beginner';
        }
        
        function formatTimeSpent(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
